name: Prediction reproducibility tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  predict:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-predict.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-predict.txt
      - name: Run portable prediction tests
        run: python -m pytest -q tests/test_predict.py
